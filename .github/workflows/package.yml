name: Package Game

on:
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game
        uses: actions/checkout@v4

      - name: Install Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - name: Run Build Script
        env:
          # This pulls the tag name from the release.
          VERSION: ${{ github.ref_name }}
        run: |
          make package
          # Rename the file if a version exists.
          if [ -n "$VERSION" ]; then
              mv Infdev.zip "Infdev-$VERSION.zip"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-package
          path: Infdev-*.zip

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        # This ensures it only tries to upload to a release.
        if: github.event_name == 'release'
        with:
          files: Infdev-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
